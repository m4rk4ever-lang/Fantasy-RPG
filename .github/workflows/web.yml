name: Web export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot and web templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          V=${GODOT_VERSION}
          BASE=https://github.com/godotengine/godot-builds/releases/download/${V}-stable
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "$BASE/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${V}-stable_linux.x86_64 ~/godot-bin/godot
          curl -sSL -o /tmp/templates.tpz "$BASE/Godot_v${V}-stable_export_templates.tpz"
          mkdir -p /tmp/tpl ~/.local/share/godot/export_templates/${V}.stable
          unzip -q /tmp/templates.tpz 'templates/web*' 'templates/version.txt' -d /tmp/tpl
          cp /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${V}.stable/

      - name: Import project
        run: ~/godot-bin/godot --headless --import

      - name: Smoke tests
        run: ~/godot-bin/godot --headless -s tools/run_tests.gd

      - name: Export Web
        run: |
          mkdir -p export/web
          ~/godot-bin/godot --headless --export-release "Web" export/web/index.html
          test -f export/web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
